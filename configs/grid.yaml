# LA-P4 model x mode grid. This file IS the experimental design.
#
# Two sets of runs come out of it:
#
#   main       60 runs in each vendor's CHAT APP (channel: web). These are scored
#              blind and analysed. 6 families x 2 modes x 5 replicates.
#   api_check  1 API call per family x mode (12 calls). Evidence that each mode
#              switch does what docs/mode-registry.md claims. Never scored.
#
# Rules
# - Weights stay fixed inside a family. A mode changes how the same model runs,
#   never which model runs. "Flash vs Pro" is a model switch, not a mode switch.
# - Every family has exactly two PRIMARY modes: fast and reasoning. Extra vendor
#   modes are allowed with `primary: false` and are exploratory only.
# - web_label is what you select in the chat app. native_label and params are
#   the API equivalent used by the api_check run.
# - FILL-ME and VERIFY are placeholders for the API check. `modegrid run` refuses
#   to call a family that still holds one. Check the vendor's API docs on the day,
#   write the value here, and commit it before the first run of that family.
# - After the first real capture, this file is frozen. Any change gets a dated
#   entry in docs/preregistration.md "Deviations".

study: LA-P4
seed: 20261001
replicates: 5          # pre-registered (power analysis in docs/power.md). Floor is 3.
max_tokens: 64000      # API check only. Generous so reasoning modes are not truncated.
                       # A family may set its own max_tokens (see gpt).

api_check:
  replicates: 1        # per family x mode, run through the API

prompts:
  - id: p1-v1
    path: vendor/llm-architects/prompts/prompt-v1.md
    sha256: ba2acba8868b254a96897e0552dd62ccd00443bc6afd084df419ba37ba0370e0
    extract: between-markers

# Masked in rater packets on top of each family's vendor/model/redact_terms.
global_redact_terms: [ChatGPT, OpenAI, Anthropic, Claude, Gemini, Google, Qwen, Alibaba, DeepSeek, Grok, xAI]

families:
  - id: claude
    vendor: Anthropic
    channel: web
    adapter: anthropic
    model: claude-sonnet-5-5  # decided 2026-10-06; Sonnet 5 is not in the claude.ai picker
    notes: >-
      Decided 2026-10-06: Sonnet 5.5, effort low vs high. The claude.ai picker
      (checked 2026-10-06) lists Fable 5.1, Opus 5.5, Sonnet 5.5 and Haiku 4.5, with
      an Effort menu (Low, Medium, High, Extra, Max) and no thinking on/off switch.
      API: Sonnet 5.5 rejects thinking disabled (400), so fast is "lowest available":
      adaptive thinking at effort low, matching the app's Effort Low. between_tools
      is not used because the app has no equivalent. Never enable server-side
      fallbacks, they answer from a different model.
    modes:
      fast:
        web_label: "claude.ai, Sonnet 5.5, Effort Low"
        native_label: "adaptive thinking, effort low (lowest available, cannot be disabled)"
        params: {thinking: {type: adaptive}, output_config: {effort: low}}
      reasoning:
        web_label: "claude.ai, Sonnet 5.5, Effort High"
        native_label: "adaptive thinking, effort high"
        params: {thinking: {type: adaptive}, output_config: {effort: high}}

  - id: gpt
    vendor: OpenAI
    channel: web
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5.6-sol        # decided 2026-10-06; the model the author's ChatGPT runs
    max_tokens: 6000          # account limit 10,000 tokens/min; input ~3,500 + 6,000 fits
    notes: >-
      Decided 2026-10-06: GPT-5.6 Sol. API docs (read 2026-10-06): gpt-5.6-sol
      accepts reasoning_effort none, low, medium (default), high, xhigh, max; none
      turns extended reasoning off. ChatGPT (author's paid plan, seen 2026-10-06):
      one GPT-5.6 Sol model with a "Thinking effort" slider of 3 stops, High at the
      right. Secondary sources say the Plus stops are Instant, Medium, High and that
      every stop runs the same Sol model; the OpenAI help page could not be fetched,
      so confirm the leftmost label reads Instant before capture. Never use Auto
      routing. Record any thinking trace that appears in a fast capture.
    modes:
      fast:
        web_label: "chatgpt.com, paid plan, GPT-5.6 Sol, Thinking effort Instant (leftmost)"
        native_label: "reasoning effort none"
        params: {_token_field: max_completion_tokens, reasoning_effort: none}
      reasoning:
        web_label: "chatgpt.com, paid plan, GPT-5.6 Sol, Thinking effort High (rightmost)"
        native_label: "reasoning effort high"
        params: {_token_field: max_completion_tokens, reasoning_effort: high}

  - id: gemini
    vendor: Google
    channel: web
    adapter: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: gemini-3.6-flash   # decided 2026-10-06; the Flash the app shows. Never Pro
    notes: >-
      Decided 2026-10-06: Gemini 3.6 Flash, the model the Gemini app picker showed on
      2026-10-06 (3.5 Flash-Lite, 3.6 Flash, 3.1 Pro, plus an Extended thinking
      option). App modes: 3.6 Flash with Extended thinking off vs on. API: 3.6 Flash
      accepts minimal, low, medium (default), high and cannot disable thinking;
      Google says minimal "does not guarantee that thinking is off". So fast is
      "lowest available" (minimal) and reasoning is high. The API check can use the
      free Gemini API tier (free-tier data may be used by Google; the prompt is
      public). If the app picker changes before capture (an October update adds
      effort levels), update web_label and run all 10 Gemini captures in one 48-hour
      window. From 9 Oct 2026 Flash needs Google AI Plus or higher in the app.
    modes:
      fast:
        web_label: "gemini.google.com, 3.6 Flash, Extended thinking OFF"
        native_label: "thinking level minimal (lowest available, cannot be disabled)"
        params: {reasoning_effort: minimal}
      reasoning:
        web_label: "gemini.google.com, 3.6 Flash, Extended thinking ON"
        native_label: "thinking level high"
        params: {reasoning_effort: high}

  - id: qwen
    vendor: Alibaba
    channel: web
    adapter: openai_compatible
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3.8-max        # decided 2026-10-06; LA-P1 used Qwen3.7-Plus, see notes
    notes: >-
      Decided 2026-10-06: Qwen3.8-Max, the current Qwen flagship in chat.qwen.ai.
      LA-P1 used Qwen3.7-Plus, so Qwen results are not directly comparable with
      LA-P1; say so in the paper. API (Alibaba Model Studio docs, read 2026-10-06):
      qwen3.8-max is a hybrid thinking model, thinking on by default, and
      enable_thinking false turns it off. Thinking text comes back as
      reasoning_content. Some Qwen endpoints only return thinking output when
      streamed, so both Qwen modes stream (_stream: true). App mode menu (seen on
      Qwen3.7-Plus 2026-10-06): Auto, Thinking, Fast. Use Fast and Thinking, never
      Auto; confirm the same menu shows for Qwen3.8-Max.
    modes:
      fast:
        web_label: "chat.qwen.ai, Qwen3.8-Max, Fast"
        native_label: "instant (enable_thinking=false)"
        params: {_stream: true, enable_thinking: false}
      reasoning:
        web_label: "chat.qwen.ai, Qwen3.8-Max, Thinking"
        native_label: "thinking (enable_thinking=true)"
        params: {_stream: true, enable_thinking: true}

  - id: deepseek
    vendor: DeepSeek
    channel: web
    adapter: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro    # researched 2026-10-02, confirm in the API check
    notes: >-
      The pilot used chat.deepseek.com with DeepSeek-V4-Pro, so the main runs stay
      there. The old API names deepseek-chat and deepseek-reasoner stopped working
      on 24 Jul 2026. V4 models think by default; thinking type disabled turns it
      off (reasoning_effort none is rejected with a 400 on V4).
    modes:
      fast:
        web_label: "chat.deepseek.com, DeepThink OFF"
        native_label: "thinking disabled"
        params: {thinking: {type: disabled}}
      reasoning:
        web_label: "chat.deepseek.com, DeepThink ON"
        native_label: "thinking on (default), effort high"
        params: {reasoning_effort: high}

  - id: grok
    vendor: xAI
    channel: web
    adapter: openai_compatible
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    model: grok-4.6           # decided 2026-10-05; the model the app runs on every plan
    redact_terms: [Elon, X Premium]
    notes: >-
      Decided 2026-10-05: grok-4.6, reasoning_effort low vs xhigh. xAI docs: grok-4.6
      accepts low, medium, high (default), xhigh, and reasoning cannot be disabled, so
      fast is "lowest available". A secondary source (15 Sep 2026) says every grok.com
      plan runs Grok 4.6; grok-4.7 (21 Sep 2026) launched for Cursor, Grok Build and
      the API, not the app. xAI does not document whether app Fast is 4.6 at low
      effort or a separate non-reasoning model, so the API check approximates the app
      switch; this is a stated threat to validity. In the app, use Fast and Expert,
      never Auto (it routes between them) or Heavy. Record the model name the app
      shows in every capture.
    modes:
      fast:
        web_label: "grok.com, Fast"
        native_label: "reasoning effort low (lowest available, cannot be disabled)"
        params: {reasoning_effort: low}
      reasoning:
        web_label: "grok.com, Expert"
        native_label: "reasoning effort xhigh (highest available)"
        params: {reasoning_effort: xhigh}
