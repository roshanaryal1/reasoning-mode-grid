# LA-P4 model x mode grid. This file IS the experimental design.
#
# Two sets of runs come out of it:
#
#   main       60 runs in each vendor's CHAT APP (channel: web). These are scored
#              blind and analysed. 6 families x 2 modes x 5 replicates.
#   api_check  1 API call per family x mode (12 calls). Evidence that each mode
#              switch does what docs/mode-registry.md claims. Never scored.
#
# Rules
# - Weights stay fixed inside a family. A mode changes how the same model runs,
#   never which model runs. "Flash vs Pro" is a model switch, not a mode switch.
# - Every family has exactly two PRIMARY modes: fast and reasoning. Extra vendor
#   modes are allowed with `primary: false` and are exploratory only.
# - web_label is what you select in the chat app. native_label and params are
#   the API equivalent used by the api_check run.
# - FILL-ME and VERIFY are placeholders for the API check. `modegrid run` refuses
#   to call a family that still holds one. Check the vendor's API docs on the day,
#   write the value here, and commit it before the first run of that family.
# - After the first real capture, this file is frozen. Any change gets a dated
#   entry in docs/preregistration.md "Deviations".

study: LA-P4
seed: 20261001
replicates: 5          # pre-registered (power analysis in docs/power.md). Floor is 3.
max_tokens: 32000      # API check only. Generous so reasoning modes are not truncated.

api_check:
  replicates: 1        # per family x mode, run through the API

prompts:
  - id: p1-v1
    path: vendor/llm-architects/prompts/prompt-v1.md
    sha256: ba2acba8868b254a96897e0552dd62ccd00443bc6afd084df419ba37ba0370e0
    extract: between-markers

# Masked in rater packets on top of each family's vendor/model/redact_terms.
global_redact_terms: [ChatGPT, OpenAI, Anthropic, Claude, Gemini, Google, Qwen, Alibaba, DeepSeek, Grok, xAI]

families:
  - id: claude
    vendor: Anthropic
    channel: web
    adapter: anthropic
    model: claude-sonnet-5
    notes: >-
      Chat: claude.ai, pick Sonnet 5 in the model menu, toggle extended thinking.
      API: Sonnet 5 accepts thinking disabled. Opus 5.5 and Sonnet 5.5 do not, so do
      not swap them in without re-reading the API docs. Never enable server-side
      fallbacks, they answer from a different model.
    modes:
      fast:
        web_label: "claude.ai, Sonnet 5, extended thinking OFF"
        native_label: "extended thinking off (thinking.type=disabled)"
        params: {thinking: {type: disabled}}
      reasoning:
        web_label: "claude.ai, Sonnet 5, extended thinking ON"
        native_label: "adaptive thinking, effort high"
        params: {thinking: {type: adaptive}, output_config: {effort: high}}

  - id: gpt
    vendor: OpenAI
    channel: web
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-5.5            # researched 2026-10-02, confirm in the API check
    notes: >-
      GPT-5.5 accepts reasoning_effort none, low, medium (default), high, xhigh.
      Chat: a paid plan, model picker set by hand to GPT-5.5 Instant or GPT-5.5
      Thinking. Instant can route a request to Thinking on its own, so check each
      fast capture for a thinking trace and record it. Free plans can fall back to
      a smaller model (GPT-5.5 Instant Mini) when limits are hit: do not use them.
    modes:
      fast:
        web_label: "chatgpt.com, paid plan, GPT-5.5 Instant (picked by hand)"
        native_label: "reasoning effort none"
        params: {_token_field: max_completion_tokens, reasoning_effort: none}
      reasoning:
        web_label: "chatgpt.com, paid plan, GPT-5.5 Thinking (picked by hand)"
        native_label: "reasoning effort high"
        params: {_token_field: max_completion_tokens, reasoning_effort: high}

  - id: gemini
    vendor: Google
    channel: web
    adapter: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    model: FILL-ME            # ONE model in both modes. Not Flash vs Pro.
    notes: >-
      Researched 2026-10-02. Gemini 3.x models cannot turn thinking off; the floor
      is minimal or low depending on the model. Gemini 2.5 Flash can turn it off
      (reasoning_effort none, or thinking budget 0). Decide: (a) Gemini 2.5 Flash,
      true off vs on, but an older model; or (b) a current Gemini 3.x Flash, lowest
      level vs high, recorded as "lowest available" like the Claude rule. In the
      Gemini app, make sure Fast and Thinking use the same model, not Flash vs Pro.
      Researched 2026-10-02: in the Gemini app, Fast and Thinking are both Gemini
      3 Flash, and Pro is a separate model. So app Fast vs Thinking is a same-model
      comparison; never use Pro. For the API check, use the exact Flash version the
      app runs, lowest accepted reasoning_effort vs high.
    modes:
      fast:
        web_label: "gemini.google.com, Fast (Gemini 3 Flash)"
        native_label: "thinking off"
        params: {reasoning_effort: VERIFY-value-that-disables-thinking}
      reasoning:
        web_label: "gemini.google.com, Thinking (Gemini 3 Flash)"
        native_label: "thinking high"
        params: {reasoning_effort: high}

  - id: qwen
    vendor: Alibaba
    channel: web
    adapter: openai_compatible
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen3.7-plus       # researched 2026-10-02; LA-P1 used Qwen 3.7 Plus in chat
    notes: >-
      Researched 2026-10-02: enable_thinking is documented for Qwen3, 3.5, 3.6 and
      3.7 hybrid models on DashScope's OpenAI-compatible endpoint, passed in the
      request body. Thinking text comes back as reasoning_content.
      Some Qwen endpoints only return thinking output when streamed. If a non-streamed
      call rejects enable_thinking=true, add streaming to OpenAICompatibleAdapter first.
    modes:
      fast:
        web_label: "chat.qwen.ai, Qwen3.7-Plus, Thinking OFF"
        native_label: "instant (enable_thinking=false)"
        params: {enable_thinking: false}
      reasoning:
        web_label: "chat.qwen.ai, Qwen3.7-Plus, Thinking ON"
        native_label: "thinking (enable_thinking=true)"
        params: {enable_thinking: true}

  - id: deepseek
    vendor: DeepSeek
    channel: web
    adapter: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro    # researched 2026-10-02, confirm in the API check
    notes: >-
      The pilot used chat.deepseek.com with DeepSeek-V4-Pro, so the main runs stay
      there. The old API names deepseek-chat and deepseek-reasoner stopped working
      on 24 Jul 2026. V4 models think by default; thinking type disabled turns it
      off (reasoning_effort none is rejected with a 400 on V4).
    modes:
      fast:
        web_label: "chat.deepseek.com, DeepThink OFF"
        native_label: "thinking disabled"
        params: {thinking: {type: disabled}}
      reasoning:
        web_label: "chat.deepseek.com, DeepThink ON"
        native_label: "thinking on (default), effort high"
        params: {reasoning_effort: high}

  - id: grok
    vendor: xAI
    channel: web
    adapter: openai_compatible
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    model: FILL-ME            # the API model closest to the chat app's model
    redact_terms: [Elon, X Premium]
    notes: >-
      Fast vs Expert is a chat-app switch. The API check can only approximate it
      with a reasoning setting on one model. Researched 2026-10-02: grok-4.3 accepts
      reasoning_effort none to xhigh; grok-4.5 low to high; grok-4.6 and 4.7 low to
      xhigh (no none). Pick the API model the app's Fast and Expert most likely use,
      and record the mismatch in the mode registry. In the app, Fast skips reasoning
      and Expert forces deep reasoning; avoid Auto, which routes between them.
    modes:
      fast:
        web_label: "grok.com, Fast"
        native_label: "API, lowest reasoning setting"
        params: {reasoning_effort: VERIFY-lowest-supported-value}
      reasoning:
        web_label: "grok.com, Expert"
        native_label: "API, highest reasoning setting"
        params: {reasoning_effort: VERIFY-highest-supported-value}
